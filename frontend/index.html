<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PolyFlash — Đặt Vé Sự Kiện Trực Tuyến</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="navbar-root"></div>

  <main class="container">
    <div class="hero">
      <div>
        <h1>Săn vé sự kiện đỉnh cao cùng PolyFlash</h1>
        <p>Đặt vé trực tuyến nhanh chóng, giữ chỗ an toàn và nhận vé điện tử tức thì.</p>
      </div>
      <button class="btn" style="background: #FFFFFF; color: var(--accent-dark);" onclick="document.getElementById('eventsGrid').scrollIntoView({behavior:'smooth'})">
        Khám phá ngay
      </button>
    </div>

    <h2 class="section-heading">Sự kiện nổi bật</h2>
    <div id="eventsGrid" class="events-grid">Đang tải danh sách sự kiện...</div>
  </main>

  <script src="/config.js"></script>
  <script src="/common.js"></script>
  <script>
    PolyFlash.renderNavbar('lobby', true);
    let allEvents = [];

    window.onSearchEvents = function (keyword) {
      const q = keyword.toLowerCase();
      renderEvents(allEvents.filter((e) => e.name.toLowerCase().includes(q) || e.venue.toLowerCase().includes(q)));
    };

    async function loadEvents() {
      const res = await fetch(PolyFlash.apiUrl(PolyFlash.API.LIST_EVENTS), { headers: PolyFlash.apiHeaders() });
      const data = await res.json();
      allEvents = data.events || [];
      renderEvents(allEvents);
    }

    function renderEvents(list) {
      const grid = document.getElementById('eventsGrid');
      grid.innerHTML = '';

      for (const ev of list) {
        const isOpen = ev.saleStatus === 'OPEN';
        const statusText = isOpen ? 'Đang mở bán' : ev.saleStatus === 'UPCOMING' ? 'Sắp mở bán' : 'Ngừng bán';
        const badgeCls = isOpen ? 'badge-open' : ev.saleStatus === 'UPCOMING' ? 'badge-upcoming' : 'badge-closed';
        const seatsUrl = `/seats.html?eventId=${encodeURIComponent(ev.id)}&eventName=${encodeURIComponent(ev.name)}`;

        const card = document.createElement('div');
        card.className = 'card event-card';
        card.innerHTML = `
          <div class="event-cover" style="background: ${ev.bannerColor}">
            <span class="badge ${badgeCls}">${statusText}</span>
          </div>
          <div class="event-body">
            <div>
              <div class="event-title">${ev.name}</div>
              <div class="event-info">
                <span>📍 ${ev.venue}</span>
                <span>📅 ${new Date(ev.startTime).toLocaleString('vi-VN')}</span>
              </div>
            </div>
            <div class="event-footer">
              <span class="price-tag">Từ 500.000đ</span>
              ${
                isOpen
                  ? `<a href="${seatsUrl}" class="btn btn-primary btn-sm">Đặt vé ngay</a>`
                  : `<button class="btn btn-outline btn-sm" disabled>Chưa mở bán</button>`
              }
            </div>
          </div>
        `;
        grid.appendChild(card);
      }
    }

    loadEvents();
  </script>
</body>
</html>
