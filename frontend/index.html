<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PolyFlash — Đặt Vé Sự Kiện & Flash Sale</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --available: #22c55e;
      --held: #f59e0b;
      --sold: #ef4444;
      --primary: #3b82f6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem 1rem;
    }
    .container { max-width: 860px; margin: 0 auto; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }
    h1 { font-size: 1.5rem; }
    .subtitle { color: var(--muted); font-size: 0.9rem; margin-top: 0.25rem; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    .legend {
      display: flex;
      gap: 1.5rem;
      margin-bottom: 1.25rem;
      font-size: 0.9rem;
    }
    .legend-item { display: flex; align-items: center; gap: 0.5rem; }
    .dot { width: 12px; height: 12px; border-radius: 3px; }
    .stage {
      text-align: center;
      background: #0b1120;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.6rem;
      margin-bottom: 1.5rem;
      color: var(--muted);
      letter-spacing: 2px;
      font-size: 0.8rem;
    }
    .seat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(84px, 1fr));
      gap: 0.75rem;
    }
    .seat {
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 0.75rem 0.5rem;
      text-align: center;
      cursor: pointer;
      transition: transform 0.12s ease, opacity 0.12s ease;
      font-weight: 600;
      font-size: 0.9rem;
    }
    .seat:hover:not(:disabled) { transform: translateY(-2px); }
    .seat.AVAILABLE { background: rgba(34, 197, 94, 0.15); border-color: var(--available); color: #86efac; }
    .seat.HELD { background: rgba(245, 158, 11, 0.15); border-color: var(--held); color: #fcd34d; cursor: not-allowed; }
    .seat.SOLD { background: rgba(239, 68, 68, 0.15); border-color: var(--sold); color: #fca5a5; cursor: not-allowed; opacity: 0.65; }
    .seat small { display: block; font-weight: 400; font-size: 0.72rem; margin-top: 0.2rem; opacity: 0.85; }
    .toolbar {
      display: flex;
      gap: 0.75rem;
      align-items: center;
      flex-wrap: wrap;
    }
    input {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.5rem 0.75rem;
      border-radius: 8px;
      font-size: 0.9rem;
    }
    button.refresh {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.55rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }
    #log {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.85rem;
      color: #cbd5e1;
      white-space: pre-wrap;
      max-height: 180px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>PolyFlash Ticketing</h1>
        <p class="subtitle">PolyFlash Live Concert 2026 — Dual-Core NoSQL + SQL</p>
      </div>
      <div class="toolbar">
        <input id="userId" type="text" value="user-demo-01" placeholder="User ID" />
        <button class="refresh" onclick="loadSeats()">Làm mới</button>
      </div>
    </header>

    <div class="card">
      <div class="legend">
        <div class="legend-item"><span class="dot" style="background: var(--available)"></span> Còn trống (AVAILABLE)</div>
        <div class="legend-item"><span class="dot" style="background: var(--held)"></span> Đang giữ 5p (HELD)</div>
        <div class="legend-item"><span class="dot" style="background: var(--sold)"></span> Đã bán (SOLD)</div>
      </div>

      <div class="stage">SÂN KHẤU / STAGE</div>
      <div id="seatGrid" class="seat-grid">Đang tải sơ đồ ghế...</div>
    </div>

    <div class="card">
      <div id="log">Sẵn sàng. Nhấn vào ghế màu xanh để giữ chỗ (Atomic Lock).</div>
    </div>
  </div>

  <script>
    const EVENT_ID = '11111111-1111-1111-1111-111111111111';

    function appendLog(msg) {
      const logEl = document.getElementById('log');
      const time = new Date().toLocaleTimeString();
      logEl.textContent = `[${time}] ${msg}\n` + logEl.textContent;
    }

    async function loadSeats() {
      try {
        const res = await fetch(`/events/${EVENT_ID}/seats`);
        const data = await res.json();
        const grid = document.getElementById('seatGrid');
        grid.innerHTML = '';

        for (const seat of data.seats) {
          const btn = document.createElement('button');
          btn.className = `seat ${seat.status}`;
          btn.disabled = seat.status !== 'AVAILABLE';
          btn.innerHTML = `${seat.seatId}<small>${seat.price.toLocaleString('vi-VN')}đ</small>`;
          btn.onclick = () => holdSeat(seat.seatId, seat.price);
          grid.appendChild(btn);
        }
      } catch (err) {
        appendLog(`Lỗi tải sơ đồ ghế: ${err.message}`);
      }
    }

    async function holdSeat(seatId, price) {
      const userId = document.getElementById('userId').value.trim() || 'anonymous';
      try {
        const res = await fetch(`/events/${EVENT_ID}/seats/${seatId}/hold`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId, price }),
        });
        const data = await res.json();
        if (res.status === 202) {
          appendLog(`✅ Giữ ghế ${seatId} thành công (202 Accepted). Đang xử lý đơn hàng...`);
        } else {
          appendLog(`⚠️ Ghế ${seatId}: ${data.error || res.status}`);
        }
        await loadSeats();
      } catch (err) {
        appendLog(`❌ Lỗi giữ ghế ${seatId}: ${err.message}`);
      }
    }

    loadSeats();
    setInterval(loadSeats, 3000);
  </script>
</body>
</html>
