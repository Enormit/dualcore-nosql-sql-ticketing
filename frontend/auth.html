<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tài khoản & Thông tin cá nhân — PolyFlash</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="navbar-root"></div>

  <main class="container">
    <!-- TRẠNG THÁI CHƯA ĐĂNG NHẬP -->
    <div id="guestView" class="card" style="max-width: 460px; margin: 1.5rem auto; display: none;">
      <h2 style="margin-bottom: 0.35rem;">Tài khoản PolyFlash</h2>
      <p style="color: var(--muted); font-size: 0.85rem; margin-bottom: 1.25rem;">
        Đăng nhập hoặc đăng ký tài khoản để đặt vé và quản lý thông tin cá nhân.
      </p>

      <div class="form-group">
        <label>Email</label>
        <input id="guestEmail" type="email" value="user-demo-01@polyflash.vn" />
      </div>
      <div class="form-group">
        <label>Mật khẩu</label>
        <input id="guestPass" type="password" value="PolyFlash@2026" />
      </div>
      <div id="registerFields" style="display: none;">
        <div class="form-group">
          <label>Họ và tên</label>
          <input id="regFullName" type="text" placeholder="VD: Nguyễn Văn An" />
        </div>
        <div class="form-group">
          <label>Số điện thoại</label>
          <input id="regPhone" type="tel" placeholder="VD: 0901234567" />
        </div>
        <div class="form-group">
          <label>Địa chỉ</label>
          <input id="regAddress" type="text" placeholder="VD: Quận 1, TP. Hồ Chí Minh" />
        </div>
      </div>

      <div style="display: flex; gap: 0.75rem;">
        <button class="btn btn-primary" style="flex: 1;" onclick="authAction('login')">Đăng nhập</button>
        <button class="btn btn-outline" style="flex: 1;" onclick="toggleRegister()">Đăng ký mới</button>
      </div>
      <div id="guestMsg" style="margin-top: 1rem; font-size: 0.85rem; color: var(--accent); text-align: center;"></div>
    </div>

    <!-- TRẠNG THÁI ĐÃ ĐĂNG NHẬP: SỬA THÔNG TIN CÁ NHÂN -->
    <div id="profileView" class="card" style="max-width: 520px; margin: 1.5rem auto; display: none;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; flex-wrap: wrap; gap: 0.5rem;">
        <div>
          <h2 style="margin-bottom: 0.2rem;">Thông tin cá nhân của tôi</h2>
          <p style="color: var(--muted); font-size: 0.85rem;">Tài khoản: <strong id="profUserId">-</strong></p>
        </div>
        <button class="btn btn-outline btn-sm" onclick="handleLogout()">Đăng xuất</button>
      </div>

      <div class="form-group">
        <label>Họ và tên</label>
        <input id="profFullName" type="text" placeholder="Nhập họ và tên" />
      </div>
      <div class="form-group">
        <label>Số điện thoại</label>
        <input id="profPhone" type="tel" placeholder="Nhập số điện thoại" />
      </div>
      <div class="form-group">
        <label>Email</label>
        <input id="profEmail" type="email" placeholder="Nhập email" />
      </div>
      <div class="form-group">
        <label>Địa chỉ</label>
        <input id="profAddress" type="text" placeholder="Nhập địa chỉ liên hệ" />
      </div>

      <button class="btn btn-primary" style="width: 100%; padding: 0.75rem;" onclick="saveProfile()">
        Lưu thay đổi thông tin
      </button>
      <div id="profMsg" style="margin-top: 1rem; font-size: 0.85rem; color: var(--accent); text-align: center;"></div>
    </div>
  </main>

  <script src="/config.js"></script>
  <script src="/common.js"></script>
  <script>
    let isRegisterOpen = false;

    function toggleRegister() {
      const box = document.getElementById('registerFields');
      if (!isRegisterOpen) {
        isRegisterOpen = true;
        box.style.display = 'block';
        return;
      }
      authAction('register');
    }

    async function renderAuthPage() {
      PolyFlash.renderNavbar('auth');
      const token = PolyFlash.getToken();

      if (!token) {
        document.getElementById('guestView').style.display = 'block';
        document.getElementById('profileView').style.display = 'none';
        return;
      }

      document.getElementById('guestView').style.display = 'none';
      document.getElementById('profileView').style.display = 'block';

      let user = PolyFlash.getUser();
      try {
        const res = await fetch(PolyFlash.apiUrl(PolyFlash.API.GET_PROFILE(user.userId)), {
          headers: PolyFlash.apiHeaders(),
        });
        if (res.ok) {
          const data = await res.json();
          user = data.user;
          PolyFlash.setAuth(null, user);
        }
      } catch {}

      document.getElementById('profUserId').textContent = user.userId;
      document.getElementById('profFullName').value = user.fullName || '';
      document.getElementById('profPhone').value = user.phone || '';
      document.getElementById('profEmail').value = user.email || '';
      document.getElementById('profAddress').value = user.address || '';
    }

    async function authAction(type) {
      const email = document.getElementById('guestEmail').value.trim();
      const fullName = document.getElementById('regFullName').value.trim();
      const phone = document.getElementById('regPhone').value.trim();
      const address = document.getElementById('regAddress').value.trim();

      const endpoint = type === 'login' ? PolyFlash.API.LOGIN : PolyFlash.API.REGISTER;
      const res = await fetch(PolyFlash.apiUrl(endpoint), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, fullName, phone, address }),
      });
      const data = await res.json();
      PolyFlash.setAuth(data.token, data.user);
      isRegisterOpen = false;
      await renderAuthPage();
    }

    async function saveProfile() {
      const user = PolyFlash.getUser();
      const fullName = document.getElementById('profFullName').value.trim();
      const phone = document.getElementById('profPhone').value.trim();
      const email = document.getElementById('profEmail').value.trim();
      const address = document.getElementById('profAddress').value.trim();

      const res = await fetch(PolyFlash.apiUrl(PolyFlash.API.UPDATE_PROFILE), {
        method: 'PUT',
        headers: PolyFlash.apiHeaders(),
        body: JSON.stringify({ userId: user.userId, fullName, phone, email, address }),
      });
      const data = await res.json();
      const msgEl = document.getElementById('profMsg');

      if (!res.ok) {
        msgEl.style.color = '#d97706';
        msgEl.textContent = data.error || 'Cập nhật thất bại';
        return;
      }

      PolyFlash.setAuth(null, data.user);
      PolyFlash.renderNavbar('auth');
      msgEl.style.color = 'var(--accent)';
      msgEl.textContent = 'Đã lưu thông tin cá nhân thành công!';
    }

    function handleLogout() {
      PolyFlash.logout();
      renderAuthPage();
    }

    renderAuthPage();
  </script>
</body>
</html>
